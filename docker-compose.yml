version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: hotelclutch-backend
    environment:
      - BACKEND_PORT=8040
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=clutch_hotel_db
      - DB_USER=postgres
      - DB_PASSWORD=123456
    ports:
      - "8040:8040"

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_BASE_URL=http://backend:8040
    container_name: hotelclutch-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"


