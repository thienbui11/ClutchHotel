services:
  db:
    image: postgres:16-alpine
    container_name: hotelclutch-postgres
    environment:
      - POSTGRES_DB=clutch_hotel_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: hotelclutch-backend
    environment:
      - BACKEND_PORT=8040
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=clutch_hotel_db
      - DB_USER=postgres
      - DB_PASSWORD=123456
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8040:8040"

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_BASE_URL=/api
    container_name: hotelclutch-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
